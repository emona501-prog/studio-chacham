apply plugin: 'com.android.application'

android {
    namespace = "com.chaiapps.memir"
    compileSdk = 36
    defaultConfig {
        applicationId "com.chaiapps.studio"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = (System.getenv("VERSION_NAME") ?: "1.0.0")
    }
    signingConfigs {
        release {
            // המפתח הקבוע של האפליקציה מגיע מה"סודות" של גיטהאב בזמן הבנייה (לא נשמר בפרויקט)
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias "memir"
                keyPassword System.getenv("KEYSTORE_PASS")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // קבצי ה-wasm וה-js נשמרים כמו שהם, בלי דחיסה (נפתחים מהר יותר)
        noCompress 'wasm', 'mjs'
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
}
